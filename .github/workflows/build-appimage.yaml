name: Build AppImage

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        node: [macos-15-intel, macos-15]
    steps:
      - name: Enable Corepack for pnpm
        run: |
          corepack enable
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', check-latest: true }

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Test license collection (collect-licenses.sh)
        run: bash packages/appimage/assets/tests/collect-licenses-test.sh
        shell: bash

      - name: Build for macOS
        run: bash ./build.sh
        shell: bash
        working-directory: ./packages/appimage
        env: { TARGET: darwin }

      - name: Upload appimage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-temp-macos-${{ matrix.node }}
          path: packages/appimage/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Enable Corepack for pnpm
        run: |
          corepack enable
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', check-latest: true }
      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Test license collection (collect-licenses.sh)
        run: bash packages/appimage/assets/tests/collect-licenses-test.sh
        shell: bash

      - name: Build for Linux
        run: bash ./build.sh
        shell: bash
        working-directory: ./packages/appimage
        env: { TARGET: linux }

      - name: Download runtime
        run: bash ./build.sh
        shell: bash
        working-directory: ./packages/appimage
        env: { TARGET: runtime }

      - name: Upload appimage artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-temp-linux
          path: packages/appimage/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  combine-artifacts:
    runs-on: ubuntu-latest
    needs: [mac, linux]
    steps:
      - name: Enable Corepack for pnpm
        run: |
          corepack enable
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
     
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', check-latest: true }
     
      - name: Download all appimage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: appimage-temp-*
          path: packages/appimage/out
          merge-multiple: true

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Zip bundle
        run: bash packages/appimage/build.sh
        shell: bash
        env: { TARGET: compress }

      - name: Delete all previous build stage artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: appimage-temp-*

      - name: Upload combined artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage-bundle
          if-no-files-found: error
          path: packages/appimage/out/**/*.tar.gz
          retention-days: 1