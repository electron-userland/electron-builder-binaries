name: Build rpm

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# Portable rpmbuild (rpm 6.1.x) with host macro isolation, used by electron-builder's rpm target.
# Linux bundles are built on manylinux_2_28 (glibc 2.28) on native runners, then smoke-tested
# with the released fpm toolset inside the images electron-builder users build in.

jobs:
  linux:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Ensure 7-Zip
        run: command -v 7za || command -v 7z || { sudo apt-get update && sudo apt-get install -y p7zip-full; }

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: bash packages/rpm/build.sh

      - name: Upload rpm Linux artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: rpm-linux-${{ matrix.arch }}
          path: packages/rpm/out
          if-no-files-found: error
          retention-days: 1

  mac:
    name: Build darwin-arm64
    # Oldest generally-available arm64 runner: bundled Homebrew dylibs inherit the runner OS as
    # their minimum macOS version (see build-linux-tools-mac.yaml). Intel macOS is not built;
    # electron-builder keeps toolsets.rpm: 'system' there.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # install_name_tool from Xcode < 26 rejects Homebrew ld_prime dylibs (see build-linux-tools-mac.yaml).
      - name: Select Xcode 26
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26 installation found on this runner"
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build
        env:
          OS_TARGET: darwin
        run: |
          command -v 7zz || command -v 7z || command -v 7za || brew install -q sevenzip
          bash packages/rpm/build.sh

      - name: Upload rpm macOS artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: rpm-darwin-arm64
          path: packages/rpm/out
          if-no-files-found: error
          retention-days: 1

  test-linux:
    name: Test linux-${{ matrix.arch }} in ${{ matrix.image }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base of electron-builder's docker/base/Dockerfile (FROM buildpack-deps:22.04-curl)
          - { arch: amd64, runner: ubuntu-latest, fpm: linux-amd64, image: "buildpack-deps:22.04-curl" }
          - { arch: arm64, runner: ubuntu-24.04-arm, fpm: linux-arm64v8, image: "buildpack-deps:22.04-curl" }
          # Older Debian userland (glibc 2.31, rpm 4.16)
          - { arch: amd64, runner: ubuntu-latest, fpm: linux-amd64, image: "debian:bullseye" }
          # glibc 2.28 floor, rpm 4.14 reading the output
          - { arch: amd64, runner: ubuntu-latest, fpm: linux-amd64, image: "almalinux:8" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download rpm bundle
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: rpm-linux-${{ matrix.arch }}
          path: dl

      - name: Extract rpm bundle and fpm toolset
        env:
          FPM_TOOLSET: ${{ matrix.fpm }}
        run: |
          command -v 7z || { sudo apt-get update && sudo apt-get install -y p7zip-full; }
          ls -la dl/rpm
          7z x -bd -obundle dl/rpm/rpm-*.7z >/dev/null
          7z x -bd -ofpmtk "artifacts/fpm/fpm-1.17.0-ruby-3.4.3-${FPM_TOOLSET}.7z" >/dev/null
          du -sh bundle

      - name: Smoke test in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD:/w" -w /w "$IMAGE" bash -c '
            set -e
            if command -v apt-get >/dev/null; then
              # distro rpm 4.x (as electron-builder images install it): an independent reader of the
              # output, and a host rpmbuild that the PATH-prepended bundle must win over.
              # binutils provides readelf to assert the payload carries a build-id.
              apt-get update -qq && apt-get install -y -qq --no-install-recommends rpm binutils >/dev/null
            fi
            bash packages/rpm/assets/test.sh --bundle-dir /w/bundle --fpm /w/fpmtk/fpm --plant-host-macros --host-rpm "$(command -v rpm)"
          '

  test-mac:
    name: Test darwin-arm64 on ${{ matrix.runner }}
    needs: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Download rpm bundle
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: rpm-darwin-arm64
          path: dl

      - name: Extract rpm bundle and fpm toolset
        run: |
          SZ="$(command -v 7zz || command -v 7z || command -v 7za || true)"
          if [ -z "$SZ" ]; then brew install -q sevenzip; SZ="$(command -v 7zz)"; fi
          "$SZ" x -bd -obundle dl/rpm/rpm-*.7z >/dev/null
          "$SZ" x -bd -ofpmtk artifacts/fpm/fpm-1.17.0-ruby-3.4.3-darwin-arm64.7z >/dev/null
          du -sh bundle

      - name: Smoke test
        run: bash packages/rpm/assets/test.sh --bundle-dir bundle --fpm "$PWD/fpmtk/fpm" --plant-host-macros
