name: Install and archive macos dmg-builder bundle

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  dmg-builder:
    runs-on: ${{ matrix.runner }}
    # Includes building OpenSSL from source.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test bundle verifier
        run: |
          bash ./packages/dmg-builder/assets/tests/verify-bundle-test.sh
      - name: Test license collection
        run: |
          bash ./packages/dmg-builder/assets/tests/collect-licenses-test.sh
      - name: Build
        run: |
          bash ./packages/dmg-builder/build.sh
      - name: Upload dmg-builder artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: dmg-builder-${{ matrix.runner }}
          path: ./packages/dmg-builder/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1