name: "Semantic Versioning enforcer"

on:
  # `pull_request` (not `pull_request_target`): the action only reads the PR title from the
  # event payload / API, so it needs no write access or secrets, even for PRs from forks.
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  main:
    permissions:
      pull-requests: read  # for amannn/action-semantic-pull-request to analyze PRs
      # statuses: write is only needed for the action's `wip` option, which is not enabled here
    runs-on: ubuntu-latest
    steps:
      # Please look up the latest version from
      # https://github.com/amannn/action-semantic-pull-request/releases
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}