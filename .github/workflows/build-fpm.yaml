name: Build FPM

on:
  workflow_call:
    outputs:
      artifactName:
        description: "FPM artifacts"
        value: fpm-artifacts

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64/v8]
    steps:
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with: { version: 9.4.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: |
          pnpm i --frozen-lockfile
          export ARCH=${{ matrix.arch }}
          bash build-linux.sh
          echo "ARCH_KEY=$(echo $ARCH | tr '/' '-')" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: fpm-linux-${{ env.ARCH_KEY }}
          path: packages/fpm/out
          if-no-files-found: error
          retention-days: 1

  mac:
    runs-on: ${{ matrix.node }}
    strategy:
      matrix:
        node: [macos-13, macos-15]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
        with: { version: 9.4.0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: pnpm i --frozen-lockfile
      - run: bash packages/fpm/build.sh
        shell: bash
        env: { OS_TARGET: darwin }
      - uses: actions/upload-artifact@v4
        with:
          name: fpm-mac-${{ matrix.node }}
          path: packages/fpm/out
          if-no-files-found: error
          retention-days: 1
