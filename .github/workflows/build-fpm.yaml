name: Build FPM

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
    
jobs:
  linux:
    runs-on: ubuntu-latest
    # arm64 runs under QEMU and now also compiles OpenSSL; it took ~33 min before that
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [
          amd64,
          i386,
          arm64/v8
          ]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Enable Corepack for pnpm
        run: |
          corepack enable
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: true, persist-credentials: false }
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', check-latest: true }
      - name: Install dependencies & build (${{ matrix.arch }})
        env:
          MATRIX_ARCH: ${{ matrix.arch }}
        run: |
          pnpm i --frozen-lockfile
          export ARCH="$MATRIX_ARCH"
          bash packages/fpm/build.sh
          echo "ARCH_KEY=$(echo "$ARCH" | tr '/' '-')" >> "$GITHUB_ENV"
      - name: Upload FPM Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fpm-linux-${{ env.ARCH_KEY }}
          path: packages/fpm/out
          if-no-files-found: error
          retention-days: 1

  mac:
    runs-on: ${{ matrix.node }}
    strategy:
      matrix:
        node: [
          macos-15-intel, # intel
          macos-15 # arm64
        ]
    steps:
      - name: Enable Corepack for pnpm
        run: |
          corepack enable
        shell: bash
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: true, persist-credentials: false }
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', check-latest: true }
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - name: Build for macOS
        run: bash packages/fpm/build.sh
        shell: bash
        env: { OS_TARGET: darwin }
      - name: Upload FPM macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fpm-mac-${{ matrix.node }}
          path: packages/fpm/out
          if-no-files-found: error
          retention-days: 1
