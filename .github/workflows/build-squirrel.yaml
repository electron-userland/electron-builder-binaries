name: Build Squirrel.Windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      NUGET_XMLDOC_MODE: skip
      # Squirrel.Windows 2.0.1 uses GitVersionTask which emits ##[set-env] commands.
      # That syntax was disabled in runners after Oct 2020; this re-enables it for
      # this isolated build job so the version-stamping step doesn't fail the run.
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true # zizmor: ignore[insecure-commands] needed by the Squirrel.Windows 2.0.1 build (see above)
    steps:
      - name: Enable Git long paths
        run: git config --system core.longpaths true
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: true, persist-credentials: false }
      - name: Test the bundle check (verify-bundle.sh)
        shell: bash
        run: bash packages/squirrel.windows/test/verify-bundle-test.sh
      - name: Test the license download (upstream-licenses-test.ps1)
        shell: pwsh
        run: ./packages/squirrel.windows/test/upstream-licenses-test.ps1
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
      - name: Build Squirrel.Windows
        run: .\packages\squirrel.windows\build.ps1
        shell: pwsh
      # build.ps1 already checks the bundle directory before zipping it; this checks the zip that is uploaded
      - name: Verify the bundle and its licenses
        shell: bash
        run: |
          shopt -s nullglob
          zips=(packages/squirrel.windows/out/squirrel.windows/*.zip)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No zip in packages/squirrel.windows/out/squirrel.windows"
            exit 1
          fi
          for zip in "${zips[@]}"; do
            bash packages/squirrel.windows/test/verify-bundle.sh "$zip"
          done
      - name: Upload Squirrel artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: squirrel-windows-patched
          path: .\packages\squirrel.windows\out
          if-no-files-found: error
          retention-days: 1
