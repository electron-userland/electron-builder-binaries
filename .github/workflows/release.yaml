name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-artifacts:
    uses: $/.github/workflows/build.yaml

  release:
    runs-on: macos-latest
    needs: build-artifacts
    permissions:
      attestations: write # to create attestation during publish step (@actions/attest)
      id-token: write # to create OIDC token for attestation/changesets/commits
    environment: release
    timeout-minutes: 15
    steps:
      - name: Enable Corepack for pnpm
        run: |
          corepack enable
        shell: bash

      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
          persist-credentials: false

      - name: Download new artifacts
        id: download-artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build-artifacts.outputs.artifactId }}
          # download-artifact v5+ extracts a single artifact fetched by ID directly into `path`
          # (v4 used `path/<artifact-name>`), so pin the old `artifacts-staging/` location explicitly
          path: artifacts-staging

      - name: Install tree for displaying structure
        run: |
          brew install tree
          mkdir -p artifacts-staging

      - name: Display structure of previously built artifacts
        run: |
          tree artifacts-staging
  
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          check-latest: true
          cache: 'pnpm'
          # never auto-enable package-manager caching in the release job (setup-node v5+ default)
          package-manager-cache: false
    
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        shell: bash

      - name: Generate GitHub App token
        uses: electron/github-app-auth-action@5f70a3726af01b612f29aac96d05aa524389c9e9 # v2.1.0
        id: generate-token
        with:
          export-git-user: true
          creds: ${{ secrets.RELEASE_BOT_APP_CREDS }}
      
      - name: Create versions PR & prepare publish
        id: changesets
        uses: changesets/action@7af85527bb2f43a404b5823a6cad47661be255c1 # v1.5.3 - @marshallofsound fork
        with:
          version: "pnpm ci:version"
          publish: "pnpm ci:publish"
          commit: 'chore(deploy): Release'
          title: 'chore(deploy): Release'
          setupGitUser: false
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Create scoped releases
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Releases created with tags: $PUBLISHED_PACKAGES"
          node scripts/changeset-publish.js
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}

      
