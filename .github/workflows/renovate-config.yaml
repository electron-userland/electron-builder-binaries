name: Renovate config

# Validates .github/renovate.json5 and checks that every "# renovate:" annotation next to a pinned
# upstream version is picked up by its customManagers (scripts/tests/renovate-annotations-test.mjs).

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - ".github/renovate.json5"
      - ".github/workflows/**"
      - "packages/**"
      - "scripts/tests/renovate-annotations-test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Renovate requires Node.js 24
      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with: { node-version: "24", check-latest: true }

      - name: Enable Corepack for pnpm
        run: corepack enable

      - name: Validate the Renovate config
        run: pnpm test:renovate-config

      - name: Check every renovate annotation is extracted
        run: pnpm test:renovate-annotations
