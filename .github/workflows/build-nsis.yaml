name: Build NSIS

on:
  workflow_call:
  workflow_dispatch:

jobs:
  # Build base bundle (Windows binary cross-compiled from Linux via Docker + MinGW-w64)
  base:
    name: Build Base Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install dependencies
        run: sudo apt-get install -y curl unzip p7zip-full rsync
        shell: bash

      - name: Build base bundle
        run: bash ./build.sh --target windows
        shell: bash
        working-directory: ./packages/nsis

      - name: Upload base artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsis-temp-base
          path: packages/nsis/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Build native macOS binaries
  mac:
    name: Build macOS Binary (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Install dependencies
        run: |
          brew install scons
        shell: bash

      - name: Build macOS binary
        run: bash ./build.sh --target mac
        shell: bash
        working-directory: ./packages/nsis

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsis-temp-macos-${{ matrix.arch }}
          path: packages/nsis/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Build native Linux binary using Docker
  linux:
    name: Build Linux Binary
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU (for arm64 cross-build)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build Linux binary
        run: bash ./build.sh --target linux
        shell: bash
        working-directory: ./packages/nsis

      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsis-temp-linux
          path: packages/nsis/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Build elevate.exe from source inside Docker
  elevate:
    name: Build elevate.exe
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build elevate.exe
        run: bash ./build.sh --target elevate
        shell: bash
        working-directory: ./packages/nsis

      - name: Upload elevate artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsis-temp-elevate
          path: packages/nsis/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Combine all artifacts into final bundle
  combine-artifacts:
    name: Combine All Bundles
    runs-on: macos-latest
    needs: [base, mac, linux, elevate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download all NSIS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nsis-temp-*
          path: packages/nsis/out
          merge-multiple: true

      - name: brew tree
        run: |
          brew install tree
        shell: bash

      - name: List downloaded artifacts
        run: |
          tree packages/nsis/out
        shell: bash

      - name: Combine bundles
        run: bash ./assets/nsis-combine.sh
        shell: bash
        working-directory: ./packages/nsis

      - name: Delete intermediate artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b
        with:
          name: nsis-temp-*

      - name: Upload combined bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsis-bundle
          path: packages/nsis/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Each platform tests both bundles: the default one (nsis-bundle-<version>.tar.gz, NSIS_CONFIG_LOG=no) and the -log one
  # (nsis-bundle-<version>-log.tar.gz, NSIS_CONFIG_LOG=yes)
  test-nsis:
    name: Test NSIS Bundle (${{ matrix.platform }}, ${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    needs: combine-artifacts
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform: [Windows (powershell), Windows (cmd), Linux (x64), Linux (arm64), macOS (x64), macOS (arm64)]
        variant: [default, log]
        include:
          - platform: Windows (powershell)
            runner: windows-latest
            platform_slug: windows
            upload_installer: true
          - platform: Windows (cmd)
            runner: windows-latest
            platform_slug: ""
            upload_installer: false
          - platform: Linux (x64)
            runner: ubuntu-latest
            platform_slug: linux-x64
            upload_installer: true
          - platform: Linux (arm64)
            runner: ubuntu-22.04-arm
            platform_slug: linux-arm64
            upload_installer: true
          - platform: macOS (x64)
            runner: macos-15-intel
            platform_slug: macos-x64
            upload_installer: true
          - platform: macOS (arm64)
            runner: macos-15
            platform_slug: macos-arm64
            upload_installer: true
    env:
      VARIANT: ${{ matrix.variant }}
      PLATFORM_SLUG: ${{ matrix.platform_slug }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download combined bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: nsis-bundle
          path: packages/nsis/out

      - name: Extract NSIS bundle
        shell: bash
        run: |
          BUNDLE_PATH="./packages/nsis/out/nsis"
          shopt -s nullglob
          archives=()
          for archive in "$BUNDLE_PATH"/nsis-bundle-*.tar.gz; do
            case "$archive" in
              *-log.tar.gz) [ "$VARIANT" = "log" ] && archives+=( "$archive" ) ;;
              *) [ "$VARIANT" = "default" ] && archives+=( "$archive" ) ;;
            esac
          done
          if (( ${#archives[@]} != 1 )); then
            echo "ERROR: expected one $VARIANT archive in $BUNDLE_PATH, found ${#archives[@]}: ${archives[*]}"
            exit 1
          fi
          echo "Using archive: ${archives[0]}"
          mkdir -p "$BUNDLE_PATH/$VARIANT"
          tar -xzf "${archives[0]}" -C "$BUNDLE_PATH/$VARIANT"
          echo "✅ Extracted to $BUNDLE_PATH/$VARIANT/nsis-bundle"

      - name: Run NSIS test suite
        timeout-minutes: 10
        shell: bash
        run: |
          LOGGING=no
          [ "$VARIANT" = "log" ] && LOGGING=yes
          bash packages/nsis/assets/nsis-test.sh --bundle-dir "packages/nsis/out/nsis/$VARIANT/nsis-bundle" --logging "$LOGGING"

      - name: Compile E2E installer
        if: matrix.upload_installer == true
        timeout-minutes: 10
        shell: bash
        run: |
          WRAPPER="$(pwd)/packages/nsis/out/nsis/$VARIANT/nsis-bundle/makensis"
          chmod +x "$WRAPPER" 2>/dev/null || true
          # Use RUNNER_TEMP so upload-artifact (Node.js) resolves the path on all platforms
          E2E_DIR="$RUNNER_TEMP/nsis-e2e"
          mkdir -p "$E2E_DIR"

          # the -log installer also writes install.log, which nsis-e2e-install.sh checks
          cat > "$E2E_DIR/e2e.nsi" << 'NSI'
          Name "NSIS E2E Test"
          OutFile "e2e-installer.exe"
          InstallDir "$TEMP\NsisE2ETest"
          SilentInstall silent

          Section "Install"
            SetOutPath "$INSTDIR"
            !ifdef E2E_LOG
              LogSet on
              LogText "nsis-e2e-logged"
            !endif
            FileOpen $0 "$INSTDIR\INSTALLED.txt" w
            FileWrite $0 "nsis-e2e-installed"
            FileClose $0
            WriteUninstaller "$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "$INSTDIR\INSTALLED.txt"
            Delete "$INSTDIR\install.log"
            Delete "$INSTDIR\Uninstall.exe"
            RMDir "$INSTDIR"
          SectionEnd
          NSI

          DEFINES=()
          [ "$VARIANT" = "log" ] && DEFINES+=( -DE2E_LOG )
          cd "$E2E_DIR"
          bash "$WRAPPER" ${DEFINES[@]+"${DEFINES[@]}"} e2e.nsi
          echo "✅ E2E installer compiled ($PLATFORM_SLUG, $VARIANT)"

      - name: Upload E2E installer
        if: matrix.upload_installer == true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nsis-e2e-installer-${{ matrix.platform_slug }}-${{ matrix.variant }}
          path: ${{ runner.temp }}/nsis-e2e/e2e-installer.exe
          if-no-files-found: error
          retention-days: 1

  test-e2e-install:
    name: E2E Install + Uninstall (Windows)
    runs-on: windows-latest
    needs: test-nsis
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Download all E2E installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: nsis-e2e-installer-*
          path: installers
          merge-multiple: false

      - name: Run install + uninstall for each compiled installer
        timeout-minutes: 10
        shell: bash
        run: bash packages/nsis/assets/nsis-e2e-install.sh --installers-dir installers
