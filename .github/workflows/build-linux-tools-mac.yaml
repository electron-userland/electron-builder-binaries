name: Build macOS linux-tools-mac bundle

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  mac:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Oldest generally-available runners so the Homebrew bottles copied into
        # the bundle keep the lowest possible minimum-macOS requirement.
        # Bottles inherit the runner's OS as their min version: macos-26 runners
        # produced binaries that refuse to load on macOS < 26 (electron-builder#10084).
        runner: [macos-15-intel, macos-15]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # build-mac.sh needs install_name_tool from Xcode 26+ to patch Homebrew
      # ld_prime binaries. macos-15 images ship Xcode 26.x preinstalled but
      # default to 16.x, so select the newest Xcode 26 explicitly.
      - name: Select Xcode 26
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26 installation found on this runner"
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Build
        run: |
          bash ./packages/linux-tools-mac/build.sh

      - name: Upload linux-tools-mac artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-tools-mac-${{ matrix.runner }}
          path: ./packages/linux-tools-mac/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1
