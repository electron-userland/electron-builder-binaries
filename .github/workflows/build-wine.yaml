name: Build Wine

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: wine-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true # for the love of all that is holy, cancel in progress runs on new pushes. linux builds take forever

permissions:
  contents: read
    
jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build for macOS
        run: bash ./build.sh
        shell: bash
        working-directory: ./packages/wine

      - name: Upload wine artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wine-macos
          path: packages/wine/out/*.tar.xz
          if-no-files-found: error
          retention-days: 1
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # holy moly docker builds take forever
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build for Linux
        run: bash ./build.sh
        shell: bash
        working-directory: ./packages/wine

      - name: Upload wine artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wine-linux
          path: packages/wine/out/*.tar.xz
          if-no-files-found: error
          retention-days: 1

  combine:
    runs-on: ubuntu-latest
    needs: [mac, linux]
    steps:
      - name: Download wine artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wine-*
          merge-multiple: true
          path: staging/wine/

      - name: Upload combined wine artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wine
          path: staging/
          if-no-files-found: error
          retention-days: 1

      - name: Delete interim artifacts
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            wine-macos
            wine-linux
