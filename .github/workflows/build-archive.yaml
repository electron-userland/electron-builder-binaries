name: Build archive

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# The archive toolset: xz, lzip, GNU tar, GNU ar and bsdtar (plus rpm/rpmbuild on linux amd64/arm64 and darwin
# arm64), built from verified upstream sources (packages/archive/assets/fetch-sources.sh). Each archive is then
# smoke-tested with the published fpm toolset, with no other copy of those tools reachable, in the images and on the
# macOS versions electron-builder users build on.

jobs:
  linux:
    name: Build linux-${{ matrix.archive }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, archive: amd64, runner: ubuntu-latest }
          # native arm64 runner: rpm's C++ build is too slow under QEMU
          - { arch: arm64, archive: arm64v8, runner: ubuntu-24.04-arm }
          - { arch: i386, archive: i386, runner: ubuntu-latest }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure 7-Zip
        run: command -v 7za || command -v 7zz || command -v 7z || { sudo apt-get update && sudo apt-get install -y p7zip-full; }

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -o pipefail
          mkdir -p packages/archive/build
          bash packages/archive/build.sh 2>&1 | tee packages/archive/build/build.log

      # Job logs are not always retrievable through the API (e.g. by automation); annotations are.
      - name: Report build result as annotations
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash packages/archive/tests/report-build.sh

      - name: Upload archive Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-linux-${{ matrix.archive }}
          path: packages/archive/out
          if-no-files-found: error
          retention-days: 1

  mac:
    name: Build darwin-${{ matrix.archive }}
    # Oldest generally-available runners: the Homebrew dylibs rpm bundles (arm64) carry the runner OS as their
    # minimum macOS version; everything else targets MACOSX_DEPLOYMENT_TARGET=15.0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archive: arm64, runner: macos-15 }
          - { archive: x86_64, runner: macos-15-intel }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install_name_tool from Xcode < 26 rejects Homebrew ld_prime dylibs (rpm's bundled libraries). macos-15
      # images ship Xcode 26.x preinstalled but default to 16.x, so select the newest Xcode 26 explicitly.
      - name: Select Xcode 26
        run: |
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode 26 installation found on this runner"
            exit 1
          fi
          echo "Selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Ensure 7-Zip and GnuPG
        run: |
          command -v 7zz || command -v 7z || command -v 7za || brew install -q sevenzip
          command -v gpg || brew install -q gnupg

      - name: Build
        run: |
          set -o pipefail
          mkdir -p packages/archive/build
          bash packages/archive/build.sh 2>&1 | tee packages/archive/build/build.log

      # Job logs are not always retrievable through the API (e.g. by automation); annotations are.
      - name: Report build result as annotations
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: bash packages/archive/tests/report-build.sh

      - name: Upload archive macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-darwin-${{ matrix.archive }}
          path: packages/archive/out
          if-no-files-found: error
          retention-days: 1

  test-linux:
    name: Test ${{ matrix.archive }} in ${{ matrix.image }}
    needs: linux
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # Base of electron-builder's docker/base/Dockerfile (FROM buildpack-deps:22.04-curl)
          - { archive: linux-amd64, runner: ubuntu-latest, platform: linux/amd64, image: "buildpack-deps:22.04-curl", rpm: true, fpm: linux-amd64, fpm-sha256: 25c7518f5187047fbd0268c8150f9fb795058f851c3954a0407bee7ed199ff87 }
          - { archive: linux-arm64v8, runner: ubuntu-24.04-arm, platform: linux/arm64, image: "buildpack-deps:22.04-curl", rpm: true, fpm: linux-arm64v8, fpm-sha256: ffa94aff17e68137867a4d2e63cebb4ff041ab7d360ec429430f0369162db983 }
          # glibc 2.28 floor; its rpm 4.14 must read the output
          - { archive: linux-amd64, runner: ubuntu-latest, platform: linux/amd64, image: "almalinux:8", rpm: true, fpm: linux-amd64, fpm-sha256: 25c7518f5187047fbd0268c8150f9fb795058f851c3954a0407bee7ed199ff87 }
          # 32-bit userland
          - { archive: linux-i386, runner: ubuntu-latest, platform: linux/386, image: "debian:bookworm", rpm: false, fpm: linux-i386, fpm-sha256: 7b53b41729dbbcd75d3f4da16ae310d9dae6892b276c9d443e4e3e64990540c0 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archive toolset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-${{ matrix.archive }}
          path: dl
          merge-multiple: true

      - name: Extract archive toolset and the published fpm toolset
        env:
          ARCHIVE: ${{ matrix.archive }}
          FPM_PLATFORM: ${{ matrix.fpm }}
          FPM_SHA256: ${{ matrix.fpm-sha256 }}
        run: bash packages/archive/tests/fetch-test-inputs.sh "dl/archive/archive-$ARCHIVE.7z" "$FPM_PLATFORM" "$FPM_SHA256"

      - name: Smoke test in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
          EXPECT_RPM: ${{ matrix.rpm }}
        run: |
          set -o pipefail
          # A throwaway container: nothing is installed, and every host copy of the tools is deleted
          docker run --rm --platform "$PLATFORM" -v "$PWD:/w" -w /w -e EXPECT_RPM "$IMAGE" bash -c '
            set -e
            args=(--bundle-dir /w/bundle --fpm-dir /w/fpm --remove-host-tools)
            if [ "$EXPECT_RPM" = "true" ]; then args+=(--expect-rpm); fi
            # the distro rpm (almalinux:8: rpm 4.14) is an independent reader of the rpm output, called by path
            if [ -x /usr/bin/rpm ]; then args+=(--host-rpm /usr/bin/rpm); fi
            bash packages/archive/assets/verify-bundle.sh --bundle-dir /w/bundle $([ "$EXPECT_RPM" = "true" ] && echo --expect-rpm)
            bash packages/archive/tests/smoke-test.sh "${args[@]}"
          ' 2>&1 | tee test.log

      - name: Report test result as annotation
        if: always()
        env:
          LABEL: ${{ matrix.archive }} in ${{ matrix.image }}
        run: bash packages/archive/tests/report-test.sh test.log

  test-mac:
    name: Test ${{ matrix.archive }} on ${{ matrix.runner }}
    needs: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { archive: darwin-arm64, runner: macos-15, rpm: true, fpm-sha256: 40846b25ece8b24f30b6cbe3838a7cf3fd05b7e8f2133a50b6ef6f1ee12ba7c3 }
          - { archive: darwin-arm64, runner: macos-26, rpm: true, fpm-sha256: 40846b25ece8b24f30b6cbe3838a7cf3fd05b7e8f2133a50b6ef6f1ee12ba7c3 }
          - { archive: darwin-x86_64, runner: macos-15-intel, rpm: false, fpm-sha256: 4299d345d906be224b47885ca1bb87b6a2cf688e1b04024d480987b051c68f76 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archive toolset
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-${{ matrix.archive }}
          path: dl
          merge-multiple: true

      - name: Extract archive toolset and the published fpm toolset
        env:
          ARCHIVE: ${{ matrix.archive }}
          FPM_SHA256: ${{ matrix.fpm-sha256 }}
        run: |
          command -v 7zz || command -v 7z || command -v 7za || brew install -q sevenzip
          bash packages/archive/tests/fetch-test-inputs.sh "dl/archive/archive-$ARCHIVE.7z" "$ARCHIVE" "$FPM_SHA256"

      - name: Smoke test
        env:
          EXPECT_RPM: ${{ matrix.rpm }}
        run: |
          set -o pipefail
          verify=(--bundle-dir bundle)
          args=(--bundle-dir bundle --fpm-dir fpm --remove-host-tools)
          if [ "$EXPECT_RPM" = "true" ]; then verify+=(--expect-rpm); args+=(--expect-rpm); fi
          # Homebrew's gnu-tar, binutils, xz, lzip and libarchive go too, not only off PATH
          brew uninstall --ignore-dependencies --force gnu-tar binutils xz lzip libarchive 2>/dev/null || true
          {
            bash packages/archive/assets/verify-bundle.sh "${verify[@]}"
            bash packages/archive/tests/smoke-test.sh "${args[@]}"
          } 2>&1 | tee test.log

      - name: Report test result as annotation
        if: always()
        env:
          LABEL: ${{ matrix.archive }} on ${{ matrix.runner }}
        run: bash packages/archive/tests/report-test.sh test.log
