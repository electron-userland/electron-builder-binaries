name: Build archive

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-latest, arch: amd64 }
          - { name: linux-arm64v8, runner: ubuntu-24.04-arm, arch: arm64 }
          - { name: linux-i386, runner: ubuntu-latest, arch: i386 }
          # oldest runners: rpm's Homebrew libraries carry the runner's macOS as their minimum
          - { name: darwin-arm64, runner: macos-15 }
          - { name: darwin-x86_64, runner: macos-15-intel }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # install_name_tool from Xcode < 26 rejects Homebrew's ld_prime dylibs (rpm's libraries)
      - name: Select Xcode 26
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)/Contents/Developer"
          command -v 7zz || brew install -q sevenzip

      - name: Build
        env:
          ARCH: ${{ matrix.arch }}
        run: bash packages/archive/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.name }}
          path: packages/archive/out
          if-no-files-found: error
          retention-days: 1

  test:
    name: Test ${{ matrix.name }} on ${{ matrix.image || matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # electron-builder's docker images are FROM buildpack-deps:22.04-curl
          - { name: linux-amd64, runner: ubuntu-latest, image: "buildpack-deps:22.04-curl", platform: linux/amd64, fpm-sha256: 25c7518f5187047fbd0268c8150f9fb795058f851c3954a0407bee7ed199ff87 }
          - { name: linux-arm64v8, runner: ubuntu-24.04-arm, image: "buildpack-deps:22.04-curl", platform: linux/arm64, fpm-sha256: ffa94aff17e68137867a4d2e63cebb4ff041ab7d360ec429430f0369162db983 }
          # glibc 2.28 floor
          - { name: linux-amd64, runner: ubuntu-latest, image: "almalinux:8", platform: linux/amd64, fpm-sha256: 25c7518f5187047fbd0268c8150f9fb795058f851c3954a0407bee7ed199ff87 }
          - { name: linux-i386, runner: ubuntu-latest, image: "debian:bookworm", platform: linux/386, fpm-sha256: 7b53b41729dbbcd75d3f4da16ae310d9dae6892b276c9d443e4e3e64990540c0 }
          - { name: darwin-arm64, runner: macos-15, fpm-sha256: 40846b25ece8b24f30b6cbe3838a7cf3fd05b7e8f2133a50b6ef6f1ee12ba7c3 }
          - { name: darwin-arm64, runner: macos-26, fpm-sha256: 40846b25ece8b24f30b6cbe3838a7cf3fd05b7e8f2133a50b6ef6f1ee12ba7c3 }
          - { name: darwin-x86_64, runner: macos-15-intel, fpm-sha256: 4299d345d906be224b47885ca1bb87b6a2cf688e1b04024d480987b051c68f76 }
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.name }}
          path: dl

      # the published fpm@2.3.1 toolset, as electron-builder downloads it
      - name: Extract the archive and fpm toolsets
        env:
          NAME: ${{ matrix.name }}
          FPM_SHA256: ${{ matrix.fpm-sha256 }}
        run: |
          command -v 7zz || command -v 7z || brew install -q sevenzip
          SZ=$(command -v 7zz || command -v 7z)
          curl -fsSL --retry 5 -o fpm.7z "https://github.com/electron-userland/electron-builder-binaries/releases/download/fpm@2.3.1/fpm-1.18.0-ruby-3.4.12-$NAME.7z"
          echo "$FPM_SHA256  fpm.7z" | shasum -a 256 -c -
          "$SZ" x -bd -ofpm fpm.7z >/dev/null
          "$SZ" x -bd -obundle "dl/archive/archive-$NAME.7z" >/dev/null

      # nothing installed, and the image's own xz, lzip, tar, ar, bsdtar and rpmbuild deleted
      - name: Smoke test in ${{ matrix.image }}
        if: matrix.image
        env:
          IMAGE: ${{ matrix.image }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$PLATFORM" -v "$PWD:/w" -w /w "$IMAGE" bash -c \
            'for t in xz lzip tar ar bsdtar rpmbuild; do rm -f /usr/bin/$t /bin/$t; done; bash packages/archive/tests/smoke-test.sh bundle fpm'

      - name: Smoke test
        if: ${{ !matrix.image }}
        run: |
          brew uninstall --ignore-dependencies --force gnu-tar binutils xz lzip libarchive || true
          bash packages/archive/tests/smoke-test.sh bundle fpm
