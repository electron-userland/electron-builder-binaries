name: Build artifacts

on:
  push:
    branches: [master]
  pull_request:
    branches-ignore:
      - changeset-release/**
  workflow_dispatch:
  workflow_call:
    outputs:
      artifactUrl:
        value: ${{ jobs.combine.outputs.artifactUrl }}
      artifactId:
        value: ${{ jobs.combine.outputs.artifactId }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Enable Corepack for pnpm
        run: |
          corepack enable

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", check-latest: true }

      - name: Install dependencies & build
        run: |
          pnpm i --frozen-lockfile

      - name: Validate release script imports
        run: pnpm run ci:version:dry-run

      - name: Validate staging artifact structure
        run: pnpm ci:validate-staging

      - name: Detect packages to release
        id: set
        run: pnpm run ci:detect-changes

      - name: Show detected packages
        env:
          MATRIX: ${{ steps.set.outputs.matrix }}
        run: |
          echo "Packages to build for release: $MATRIX"

  # Shared bundle guards (scripts/), tested on every runner OS the bundles are built and checked on
  script-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the license guard (scripts/verify-licenses.sh)
        shell: bash
        run: bash ./scripts/tests/verify-licenses-test.sh

  fpm:
    if: contains(needs.detect.outputs.matrix, '"fpm"')
    uses: $/.github/workflows/build-fpm.yaml
    needs: detect

  win-codesign:
    if: contains(needs.detect.outputs.matrix, '"win-codesign"')
    uses: $/.github/workflows/build-wincodesign.yaml
    needs: detect

  appimage:
    if: contains(needs.detect.outputs.matrix, '"appimage"')
    uses: $/.github/workflows/build-appimage.yaml
    needs: detect

  ran:
    if: contains(needs.detect.outputs.matrix, '"ran"')
    uses: $/.github/workflows/build-ran.yaml
    needs: detect

  nsis:
    if: contains(needs.detect.outputs.matrix, '"nsis"')
    uses: $/.github/workflows/build-nsis.yaml
    needs: detect

  dmg-builder:
    if: contains(needs.detect.outputs.matrix, '"dmg-builder"')
    uses: $/.github/workflows/build-dmg-builder.yaml
    needs: detect

  linux-tools-mac:
    if: contains(needs.detect.outputs.matrix, '"linux-tools-mac"')
    uses: $/.github/workflows/build-linux-tools-mac.yaml
    needs: detect

  squirrel:
    if: contains(needs.detect.outputs.matrix, '"squirrel.windows"')
    uses: $/.github/workflows/build-squirrel.yaml
    needs: detect

  wine:
    if: contains(needs.detect.outputs.matrix, '"wine"')
    uses: $/.github/workflows/build-wine.yaml
    needs: detect

  wix:
    if: contains(needs.detect.outputs.matrix, '"wix"')
    uses: $/.github/workflows/build-wix.yaml
    needs: detect
    
  icons:
    if: contains(needs.detect.outputs.matrix, '"icons"')
    uses: $/.github/workflows/build-icons.yaml
    needs: detect

  sevenzip:
    if: contains(needs.detect.outputs.matrix, '"7zip"')
    uses: $/.github/workflows/build-7zip.yaml
    needs: detect

  rpm:
    if: contains(needs.detect.outputs.matrix, '"rpm"')
    uses: $/.github/workflows/build-rpm.yaml
    needs: detect

  combine:
    runs-on: macos-latest
    needs: [
        fpm,
        win-codesign,
        appimage,
        ran,
        nsis,
        dmg-builder,
        squirrel,
        wine,
        linux-tools-mac,
        wix,
        icons,
        sevenzip,
        rpm
      ]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      contains(needs.*.result, 'success')

    outputs:
      artifactUrl: ${{ steps.upload.outputs.artifact-url }}
      artifactId: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Enable Corepack for pnpm
        run: |
          corepack enable
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", check-latest: true }

      - name: Install tree via Homebrew
        run: |
          brew install tree
          mkdir -p out

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true

      - name: Show artifact tree
        run: |
          tree ./out

      - name: Compress artifacts
        run: sh ./scripts/compress-artifacts.sh

      - name: Validate artifact automation
        run: |
          pnpm i --frozen-lockfile
          tree ./artifacts-staging
          DRY_RUN=true node ./scripts/changeset-version.js

      - name: Upload combined artifacts
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-staging
          path: artifacts-staging
          if-no-files-found: ignore
          retention-days: 1
