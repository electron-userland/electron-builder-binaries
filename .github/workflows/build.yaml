name: Build artifacts

on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifactUrl:
        value: ${{ jobs.combine.outputs.artifactUrl }}
      artifactId:
        value: ${{ jobs.combine.outputs.artifactId }}

permissions:
  contents: read

jobs:
  fpm:
    uses: ./.github/workflows/build-fpm.yaml

  squirrel:
    uses: ./.github/workflows/build-squirrel.yaml

  combine:
    runs-on: macos-latest
    needs: [fpm, squirrel]
    outputs:
      artifactUrl: ${{ steps.upload.outputs.artifact-url }}
      artifactId: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Install `tree`
        run: |
          brew install tree
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with: { version: 9.4.0 }
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4
        with: { node-version: '22' }
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          path: out
          merge-multiple: true
      - name: Preview artifact tree
        run: tree ./out
      - name: Compress artifacts
        run: sh ./scripts/compress-artifacts.sh
      - name: Dry run publish script to validate artifacts
        run: |
          pnpm i --frozen-lockfile
          tree ./artifacts-staging
          DRY_RUN=true node ./scripts/changeset-version.js
      - id: upload
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4
        with:
          name: artifacts-staging
          path: artifacts-staging
          if-no-files-found: error
          retention-days: 1
