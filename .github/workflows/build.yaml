name: Build artifacts

on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifactUrl:
        value: ${{ jobs.combine.outputs.artifactUrl }}
      artifactId:
        value: ${{ jobs.combine.outputs.artifactId }}

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Enable Corepack for pnpm
        run: |
          corepack enable

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with: { node-version: "22" }

      - name: Install dependencies & build
        run: |
          pnpm i --frozen-lockfile

      - name: Validate release script imports
        run: node scripts/changeset-publish.js --dry-run

      - name: Detect packages to release
        id: set
        run: sh ./scripts/detect-packages.sh

      - name: Show detected packages
        run: |
          echo "Packages to build for release: ${{ steps.set.outputs.matrix }}"

  fpm:
    if: contains(needs.detect.outputs.matrix, '"fpm"')
    uses: ./.github/workflows/build-fpm.yaml
    needs: detect

  win-codesign:
    if: contains(needs.detect.outputs.matrix, '"win-codesign"')
    uses: ./.github/workflows/build-wincodesign.yaml
    needs: detect

  appimage:
    if: contains(needs.detect.outputs.matrix, '"appimage"')
    uses: ./.github/workflows/build-appimage.yaml
    needs: detect

  ran:
    if: contains(needs.detect.outputs.matrix, '"ran"')
    uses: ./.github/workflows/build-ran.yaml
    needs: detect

  nsis:
    if: contains(needs.detect.outputs.matrix, '"nsis"')
    uses: ./.github/workflows/build-nsis.yaml
    needs: detect

  dmg-builder:
    if: contains(needs.detect.outputs.matrix, '"dmg-builder"')
    uses: ./.github/workflows/build-dmg-builder.yaml
    needs: detect

  linux-tools-mac:
    if: contains(needs.detect.outputs.matrix, '"linux-tools-mac"')
    uses: ./.github/workflows/build-linux-tools-mac.yaml
    needs: detect

  squirrel:
    if: contains(needs.detect.outputs.matrix, '"squirrel.windows"')
    uses: ./.github/workflows/build-squirrel.yaml
    needs: detect

  icons:
    if: contains(needs.detect.outputs.matrix, '"icons"')
    uses: ./.github/workflows/build-icons.yaml
    needs: detect

  combine:
    runs-on: macos-latest
    needs: [
        fpm,
        win-codesign,
        appimage,
        ran,
        nsis,
        dmg-builder,
        linux-tools-mac,
        squirrel,
        icons
      ]
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      contains(needs.*.result, 'success')

    outputs:
      artifactUrl: ${{ steps.upload.outputs.artifact-url }}
      artifactId: ${{ steps.upload.outputs.artifact-id }}

    steps:
      - name: Enable Corepack for pnpm
        run: |
          corepack enable
        shell: bash

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }

      - name: Setup Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a
        with: { node-version: "22" }

      - name: Install tree via Homebrew
        run: |
          brew install tree
          mkdir -p out

      - name: Download all artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          path: out
          merge-multiple: true

      - name: Show artifact tree
        run: |
          tree ./out

      - name: Compress artifacts
        run: sh ./scripts/compress-artifacts.sh

      - name: Validate artifact automation
        run: |
          pnpm i --frozen-lockfile
          tree ./artifacts-staging
          DRY_RUN=true node ./scripts/changeset-version.js

      - name: Upload combined artifacts
        id: upload
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: artifacts-staging
          path: artifacts-staging
          if-no-files-found: ignore
          retention-days: 1
