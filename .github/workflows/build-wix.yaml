name: Build WiX toolset bundle

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  # Download the official WiX v3 binaries and repackage them. No compiler or
  # Windows runner is needed — it is a download + checksum + repackage step.
  build:
    name: Build (download + repackage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build WiX bundle
        shell: bash
        run: bash ./packages/wix/build.sh --target build

      - name: Upload wix artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wix
          path: ./packages/wix/out/**/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  # Smoke test on each platform. Structural checks always pass; the full
  # functional test (candle → light → .msi) runs only on a native x86_64 host
  # with wine-mono available (see Dockerfile notes) and skips otherwise.
  test:
    name: Test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    needs: build
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-26]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wix
          path: ./packages/wix/out

      - name: Install Wine (macOS)
        if: runner.os == 'macOS'
        run: brew install --cask wine-stable

      - name: Test (Linux — Docker)
        if: runner.os == 'Linux'
        run: bash ./packages/wix/build.sh --target test-linux

      - name: Test (macOS — native Wine)
        if: runner.os == 'macOS'
        run: bash ./packages/wix/build.sh --target test-mac
