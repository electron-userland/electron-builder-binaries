name: Build Windows Code Sign

on:
  workflow_dispatch:
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install dependencies & build (${{ matrix.arch }})
        run: |
          PLATFORM_ARCH=${{ matrix.arch }} bash ./packages/win-codesign/build.sh

      - name: Upload win-codesign Linux artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-linux-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  windows:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            mingw_prefix: mingw-w64-x86_64
            runner: windows-2025
          - arch: x86
            msystem: MINGW32
            mingw_prefix: mingw-w64-i686
            runner: windows-2025
          - arch: arm64
            msystem: CLANGARM64
            mingw_prefix: mingw-w64-clang-aarch64
            runner: windows-2025

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSYS2
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            make
            zip
            unzip
          pacboy: >-
            gcc:p
            cmake:p
            openssl:p
            curl:p
            zlib:p
            pkgconf:p

      - name: Install architecture-specific packages
        run: |
          # libgsf and nodejs aren't available for all architectures
          if [[ "${{ matrix.arch }}" == "x86" ]]; then
            # For x86, skip libgsf and nodejs (not available in mingw32)
            echo "Skipping libgsf and nodejs for x86 (not available)"
          else
            # For x64 and arm64, install libgsf and nodejs
            pacboy --noconfirm -S --needed libgsf:p nodejs:p
          fi

      - name: Build osslsigncode (${{ matrix.arch }})
        run: |
          PLATFORM_ARCH=${{ matrix.arch }} bash ./packages/win-codesign/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-windows-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  mac:
    runs-on: ${{ matrix.node }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            node: macos-15-intel
          - arch: arm64
            node: macos-15
    steps:
      - name: Install grealpath
        run: brew install coreutils

      - name: Build for macOS
        shell: bash
        run: |
          PLATFORM_ARCH=${{ matrix.arch }} bash packages/win-codesign/build.sh

      - name: Upload win-codesign macOS artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-darwin-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1
