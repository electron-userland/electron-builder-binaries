name: Build Windows Code Sign

on:
  workflow_dispatch:
    inputs:
      osslsigncode_ver:
        description: "osslsigncode version tag to build"
        default: "2.11"
        required: false
      rcedit_version:
        description: "rcedit release version"
        default: "2.0.0"
        required: false
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build win-codesign Linux (${{ matrix.arch }})
        run: |
          bash ./packages/win-codesign/build.sh \
            --arch ${{ matrix.arch }} \
            --osslsigncode-ver ${{ inputs.osslsigncode_ver || '2.11' }}

      - name: Upload win-codesign Linux artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-linux-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  windows:
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSYS2
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'MINGW64' }}
          update: true
          install: >-
            git
            make
            zip
            unzip
          pacboy: >-
            gcc:p
            cmake:p
            openssl:p
            curl:p
            libgsf:p
            zlib:p
            pkgconf:p

      - name: Build osslsigncode for Windows (${{ matrix.arch }})
        run: |
          bash ./packages/win-codesign/build.sh \
            --arch ${{ matrix.arch }} \
            --osslsigncode-ver ${{ inputs.osslsigncode_ver || '2.11' }} \
            --target ossl

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-windows-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  windows-kits-rcedit:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSYS2
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            zip
            unzip
          pacboy: >-
            gcc:p
            cmake:p
            openssl:p
            curl:p
            libgsf:p
            zlib:p
            pkgconf:p

      - name: Build Windows kits + ats + rcedit (x64 only)
        run: |
          bash ./packages/win-codesign/build.sh \
            --arch x64 \
            --rcedit-version ${{ inputs.rcedit_version || '2.0.0' }} \
            --target kits \
            --target ats \
            --target rcedit

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-windows-kits-rcedit
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  windows-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Wine and Xvfb
        run: sudo apt-get install -y wine64 xvfb

      - name: Build dotnet runtime bundle
        run: bash ./packages/win-codesign/assets/build-win-dotnet.sh

      - name: Run dotnet test suite (unit + Wine smoke test)
        run: xvfb-run --auto-servernum bash ./packages/win-codesign/test/build-win-dotnet-test.sh

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-dotnet-runtime
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  mac:
    runs-on: ${{ matrix.node }}
    # Includes building OpenSSL and libp11 from source.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            node: macos-15-intel
          - arch: arm64
            node: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build win-codesign macOS (${{ matrix.arch }})
        shell: bash
        run: |
          bash packages/win-codesign/build.sh \
            --arch ${{ matrix.arch }} \
            --osslsigncode-ver ${{ inputs.osslsigncode_ver || '2.11' }}

      - name: Test win-codesign macOS bundle (${{ matrix.arch }})
        shell: bash
        run: |
          bash packages/win-codesign/test/build-mac-test.sh \
            packages/win-codesign/out/win-codesign/win-codesign-darwin-${{ matrix.arch }}.zip

      - name: Install SoftHSM and libp11 for the PKCS#11 test
        run: brew install softhsm libp11

      - name: PKCS#11 signing test (${{ matrix.arch }})
        shell: bash
        run: |
          bash packages/win-codesign/test/pkcs11-sign-test.sh \
            packages/win-codesign/out/win-codesign/win-codesign-darwin-${{ matrix.arch }}.zip

      # Not gating: for comparison, the previously published 1.3.0 bundle (linked to Homebrew's
      # openssl@3) on the same runner, as electron-builder calls it and with libp11's provider dir set.
      - name: PKCS#11 comparison with published 1.3.0 bundle (${{ matrix.arch }})
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          MODS="$(brew --prefix libp11)/lib/ossl-modules"
          OLD="$RUNNER_TEMP/wcs-1.3.0.zip"
          curl -fsSL -o "$OLD" "https://github.com/electron-userland/electron-builder-binaries/releases/download/win-codesign%401.3.0/win-codesign-darwin-${{ matrix.arch }}.zip"
          echo "::group::published 1.3.0 bundle, no env"
          bash packages/win-codesign/test/pkcs11-sign-test.sh "$OLD"
          echo "::endgroup::"
          echo "::group::published 1.3.0 bundle, OPENSSL_MODULES=$MODS"
          PKCS11_EXTRA_ENV="OPENSSL_MODULES=$MODS" bash packages/win-codesign/test/pkcs11-sign-test.sh "$OLD"
          echo "::endgroup::"
          exit 0

      - name: Upload win-codesign macOS artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-darwin-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1
