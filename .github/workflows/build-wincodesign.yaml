name: Build Windows Code Sign

on:
  workflow_dispatch:
    inputs:
      osslsigncode_ver:
        description: "osslsigncode version tag to build"
        default: "2.11"
        required: false
      rcedit_version:
        description: "rcedit release version"
        default: "2.0.0"
        required: false
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build win-codesign Linux (${{ matrix.arch }})
        run: |
          bash ./packages/win-codesign/build.sh \
            --arch ${{ matrix.arch }} \
            --osslsigncode-ver ${{ inputs.osslsigncode_ver || '2.11' }}

      - name: Upload win-codesign Linux artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-linux-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  windows:
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSYS2
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'MINGW64' }}
          update: true
          install: >-
            git
            make
            zip
            unzip
          pacboy: >-
            gcc:p
            cmake:p
            openssl:p
            curl:p
            libgsf:p
            zlib:p
            pkgconf:p
            nodejs:p

      - name: Build win-codesign Windows (${{ matrix.arch }})
        run: |
          bash ./packages/win-codesign/build.sh \
            --arch ${{ matrix.arch }} \
            --osslsigncode-ver ${{ inputs.osslsigncode_ver || '2.11' }} \
            --target ossl

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-windows-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  windows-kits-rcedit:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup MSYS2
        uses: msys2/setup-msys2@fb197b72ce45fb24f17bf3f807a388985654d1f2 # v2.29.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            zip
            unzip
          pacboy: >-
            gcc:p
            cmake:p
            openssl:p
            curl:p
            libgsf:p
            zlib:p
            pkgconf:p
            nodejs:p

      - name: Build Windows kits + rcedit (x64 only)
        run: |
          bash ./packages/win-codesign/build.sh \
            --arch x64 \
            --rcedit-version ${{ inputs.rcedit_version || '2.0.0' }} \
            --target kits \
            --target rcedit

      - name: Upload artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-windows-kits-rcedit
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  mac:
    runs-on: ${{ matrix.node }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            node: macos-15-intel
          - arch: arm64
            node: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Build win-codesign macOS (${{ matrix.arch }})
        shell: bash
        run: |
          bash packages/win-codesign/build.sh \
            --arch ${{ matrix.arch }} \
            --osslsigncode-ver ${{ inputs.osslsigncode_ver || '2.11' }}

      - name: Upload win-codesign macOS artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1
        with:
          name: win-codesign-darwin-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1
