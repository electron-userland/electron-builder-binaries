name: Build Windows Code Sign

on:
  workflow_dispatch:
    inputs:
      osslsigncode_ver:
        description: "osslsigncode version tag to build"
        default: "2.14"
        required: false
      rcedit_version:
        description: "rcedit release version"
        default: "2.0.0"
        required: false
  workflow_call:

permissions:
  contents: read

jobs:
  # Unit tests of the bundle scripts (license layout, ATS, Windows Kits, rcedit) with mocked downloads
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the LICENSES/ layout helpers
        run: bash ./packages/win-codesign/test/licenses-test.sh

      - name: Test the ATS bundle script
        run: bash ./packages/win-codesign/test/build-win-ats-test.sh

      - name: Test the Windows Kits bundle script
        run: bash ./packages/win-codesign/test/build-win-kits-test.sh

      - name: Test the rcedit bundle script
        run: bash ./packages/win-codesign/test/build-win-rcedit-test.sh

  linux:
    # arm64 builds natively: OpenSSL is built from source, which is too slow under QEMU.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Includes building OpenSSL and libp11 from source.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, i386, arm64]
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build win-codesign Linux (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          OSSLSIGNCODE_VER: ${{ inputs.osslsigncode_ver || '2.14' }}
        run: |
          bash ./packages/win-codesign/build.sh \
            --arch "$ARCH" \
            --osslsigncode-ver "$OSSLSIGNCODE_VER"

      # Licenses (scripts/verify-licenses.sh), then a clean ubuntu:24.04 (no OpenSSL 1.1): linkage, file signing and
      # SoftHSM PKCS#11 signing.
      - name: Test win-codesign Linux bundle (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash ./packages/win-codesign/test/build-linux-docker-test.sh \
            "./packages/win-codesign/out/win-codesign/win-codesign-linux-$ARCH.zip" \
            "$ARCH"

      - name: Upload win-codesign Linux artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-codesign-linux-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  windows:
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-2025' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: ${{ matrix.arch == 'arm64' && 'CLANGARM64' || 'MINGW64' }}
          update: true
          install: >-
            git
            make
            zip
            unzip
          pacboy: >-
            gcc:p
            cmake:p
            openssl:p
            curl:p
            libgsf:p
            zlib:p
            pkgconf:p

      - name: Build osslsigncode for Windows (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
          OSSLSIGNCODE_VER: ${{ inputs.osslsigncode_ver || '2.14' }}
        run: |
          bash ./packages/win-codesign/build.sh \
            --arch "$ARCH" \
            --osslsigncode-ver "$OSSLSIGNCODE_VER" \
            --target ossl

      - name: Check osslsigncode bundle licenses (${{ matrix.arch }})
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash ./packages/win-codesign/assets/verify-bundle-licenses.sh \
            "./packages/win-codesign/out/win-codesign/win-codesign-windows-$ARCH.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-codesign-windows-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  windows-kits-rcedit:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup MSYS2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            zip
            unzip
          pacboy: >-
            gcc:p
            cmake:p
            openssl:p
            curl:p
            libgsf:p
            zlib:p
            pkgconf:p

      - name: Build Windows kits + ats + rcedit (x64 only)
        env:
          RCEDIT_VERSION: ${{ inputs.rcedit_version || '2.0.0' }}
        run: |
          bash ./packages/win-codesign/build.sh \
            --arch x64 \
            --rcedit-version "$RCEDIT_VERSION" \
            --target kits \
            --target ats \
            --target rcedit

      # The Windows SDK binaries ship with the installed SDK's license terms (LICENSES/windows-sdk/).
      - name: Check Windows kits + ats + rcedit bundle licenses
        run: |
          bash ./packages/win-codesign/assets/verify-bundle-licenses.sh ./packages/win-codesign/out/win-codesign/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-codesign-windows-kits-rcedit
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  windows-dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Wine and Xvfb
        run: sudo apt-get install -y wine64 xvfb

      - name: Build dotnet runtime bundle
        run: bash ./packages/win-codesign/assets/build-win-dotnet.sh

      - name: Run dotnet test suite (unit + license check + Wine smoke test)
        run: xvfb-run --auto-servernum bash ./packages/win-codesign/test/build-win-dotnet-test.sh

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-codesign-dotnet-runtime
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1

  mac:
    runs-on: ${{ matrix.node }}
    # Includes building OpenSSL and libp11 from source.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            node: macos-15-intel
          - arch: arm64
            node: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build win-codesign macOS (${{ matrix.arch }})
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          OSSLSIGNCODE_VER: ${{ inputs.osslsigncode_ver || '2.14' }}
        run: |
          bash packages/win-codesign/build.sh \
            --arch "$ARCH" \
            --osslsigncode-ver "$OSSLSIGNCODE_VER"

      # Licenses (scripts/verify-licenses.sh), linkage, file signing.
      - name: Test win-codesign macOS bundle (${{ matrix.arch }})
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash packages/win-codesign/test/build-mac-test.sh \
            "packages/win-codesign/out/win-codesign/win-codesign-darwin-$ARCH.zip"

      - name: Install SoftHSM for the PKCS#11 test
        run: brew install softhsm

      - name: PKCS#11 signing test (${{ matrix.arch }})
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          bash packages/win-codesign/test/pkcs11-sign-test.sh \
            "packages/win-codesign/out/win-codesign/win-codesign-darwin-$ARCH.zip"

      - name: Upload win-codesign macOS artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-codesign-darwin-${{ matrix.arch }}
          path: ./packages/win-codesign/out/**/*.zip
          if-no-files-found: error
          retention-days: 1
